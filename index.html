<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ГосСервис — Telegram Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fa;
      color: #172033;
    }

    .header {
      background: #1769d2;
      color: white;
      padding: 22px 18px;
      border-radius: 0 0 24px 24px;
    }

    .header small {
      opacity: 0.85;
    }

    .header h1 {
      margin-top: 6px;
      font-size: 25px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .profile {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-top: -5px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .profile-name {
      font-size: 19px;
      font-weight: bold;
    }

    .profile-id {
      color: #777;
      margin-top: 5px;
      font-size: 14px;
    }

    .section-title {
      margin: 25px 0 12px;
      font-size: 20px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service {
      background: white;
      border: none;
      border-radius: 18px;
      padding: 18px 12px;
      min-height: 115px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: 0.15s;
    }

    .service:active {
      transform: scale(0.97);
    }

    .icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .service-title {
      font-weight: bold;
      font-size: 16px;
    }

    .service-text {
      color: #777;
      font-size: 12px;
      margin-top: 5px;
    }

    .button {
      width: 100%;
      border: none;
      background: #1769d2;
      color: white;
      padding: 15px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .button:active {
      transform: scale(0.98);
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 30px 10px;
    }

    .notice {
      display: none;
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .notice h2 {
      margin-bottom: 10px;
    }

    .back {
      border: none;
      background: transparent;
      color: #1769d2;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <small>Демонстрационный сервис</small>
      <h1>ГосСервис</h1>
    </div>
  </header>

  <main class="container">

    <section class="profile">
      <div class="profile-name" id="userName">
        Пользователь
      </div>

      <div class="profile-id" id="userId">
        Telegram ID: —
      </div>
    </section>

    <section id="mainPage">

      <h2 class="section-title">Популярные услуги</h2>

      <div class="services">

        <button class="service" onclick="openService('Документы')">
          <div class="icon">📄</div>
          <div class="service-title">Документы</div>
          <div class="service-text">Информация о документах</div>
        </button>

        <button class="service" onclick="openService('Справки')">
          <div class="icon">📋</div>
          <div class="service-title">Справки</div>
          <div class="service-text">Получение справок</div>
        </button>

        <button class="service" onclick="openService('Заявления')">
          <div class="icon">📝</div>
          <div class="service-title">Заявления</div>
          <div class="service-text">Подать заявление</div>
        </button>

        <button class="service" onclick="openService('Платежи')">
          <div class="icon">💳</div>
          <div class="service-title">Платежи</div>
          <div class="service-text">Демонстрационные платежи</div>
        </button>

      </div>

      <h2 class="section-title">Информация</h2>

      <div class="profile">
        <b>О приложении</b>

        <p style="margin-top:8px;color:#666;font-size:14px;">
          Это демонстрационный Telegram Mini App.
          Он не является официальным государственным сервисом.
        </p>
      </div>

    </section>

    <section class="notice" id="servicePage">

      <button class="back" onclick="goBack()">
        ← Назад
      </button>

      <h2 id="serviceTitle">Услуга</h2>

      <p id="serviceDescription"
         style="color:#666;margin-top:10px;">
      </p>

      <button class="button" onclick="sendRequest()">
        Отправить заявку
      </button>

    </section>

    <div class="footer">
      Демонстрационное приложение
    </div>

  </main>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    // Данные пользователя Telegram
    const user = tg.initDataUnsafe?.user;

    if (user) {
      const name =
        user.first_name +
        (user.last_name ? " " + user.last_name : "");

      document.getElementById("userName").textContent = name;

      document.getElementById("userId").textContent =
        "Telegram ID: " + user.id;
    }

    function openService(service) {
      document.getElementById("mainPage").style.display = "none";
      document.getElementById("servicePage").style.display = "block";

      document.getElementById("serviceTitle").textContent =
        service;

      document.getElementById("serviceDescription").textContent =
        "Вы выбрали раздел «" + service +
        "». Здесь можно разместить форму заявки.";
    }

    function goBack() {
      document.getElementById("servicePage").style.display = "none";
      document.getElementById("mainPage").style.display = "block";
    }

    function sendRequest() {
      tg.showPopup({
        title: "Заявка",
        message: "Демонстрационная заявка отправлена.",
        buttons: [
          {
            id: "ok",
            type: "ok"
          }
        ]
      });
    }
  </script>

</body>
</html>
